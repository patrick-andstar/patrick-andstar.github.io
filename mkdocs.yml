site_name: wjc-wiki
site_description: 我的技术书学习笔记 · 原文全保留 + AI 梳理（OI-Wiki 风格）
site_url: https://patrick-andstar.github.io/
docs_dir: docs
theme:
  name: material
  language: zh
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: white
    accent: red
    toggle:
      icon: material/weather-sunny
      name: 切到深色
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue
    accent: blue
    toggle:
      icon: material/weather-night
      name: 切到浅色
  features:
  - navigation.tabs
  - navigation.instant
  - navigation.top
  - navigation.indexes
  - content.code.copy
  - search.highlight
  font:
    text: Fira Sans
    code: Fira Mono
  icon:
    logo: material/school
nav:
- 首页: index.md
- 书籍:
  - CTF特训营:
    - 00-目录: books/ctf-special-training/00-目录.md
    - 第1章 常用工具安装及使用: books/ctf-special-training/第1章 常用工具安装及使用.md
    - 第2章 SQL注入攻击: books/ctf-special-training/第2章 SQL注入攻击.md
    - 第3章 跨站脚本攻击: books/ctf-special-training/第3章 跨站脚本攻击.md
    - 第4章 服务端请求伪造: books/ctf-special-training/第4章 服务端请求伪造.md
    - 第5章 利用特性进行攻击: books/ctf-special-training/第5章 利用特性进行攻击.md
    - 第6章 代码审计: books/ctf-special-training/第6章 代码审计.md
    - 第7章 条件竞争: books/ctf-special-training/第7章 条件竞争.md
    - 第8章 案例解析: books/ctf-special-training/第8章 案例解析.md
    - 第9章 Reverse概述: books/ctf-special-training/第9章 Reverse概述.md
    - 第10章 Reverse分析: books/ctf-special-training/第10章 Reverse分析.md
    - 第11章 PWN基础: books/ctf-special-training/第11章 PWN基础.md
    - 第12章 栈相关漏洞: books/ctf-special-training/第12章 栈相关漏洞.md
    - 第13章 堆相关漏洞: books/ctf-special-training/第13章 堆相关漏洞.md
    - 第14章 格式化字符串漏洞: books/ctf-special-training/第14章 格式化字符串漏洞.md
    - 第15章 整型漏洞: books/ctf-special-training/第15章 整型漏洞.md
    - 第16章 逻辑漏洞: books/ctf-special-training/第16章 逻辑漏洞.md
    - 第17章 Attack&Defense模式: books/ctf-special-training/第17章 Attack&Defense模式.md
    - 第18章 Crypto概述: books/ctf-special-training/第18章 Crypto概述.md
    - 第19章 编码: books/ctf-special-training/第19章 编码.md
    - 第20章 古典密码: books/ctf-special-training/第20章 古典密码.md
    - 第21章 现代密码: books/ctf-special-training/第21章 现代密码.md
    - 第22章 真题解析: books/ctf-special-training/第22章 真题解析.md
    - 第23章 APK基础: books/ctf-special-training/第23章 APK基础.md
    - 第24章 Dalvik层逆向分析: books/ctf-special-training/第24章 Dalvik层逆向分析.md
    - 第25章 Native层逆向: books/ctf-special-training/第25章 Native层逆向.md
    - 第26章 IoT基础知识: books/ctf-special-training/第26章 IoT基础知识.md
    - 第27章 IoT固件逆向工程: books/ctf-special-training/第27章 IoT固件逆向工程.md
    - 第28章 固件结构分析: books/ctf-special-training/第28章 固件结构分析.md
    - 第29章 无线信号分析: books/ctf-special-training/第29章 无线信号分析.md
    - 第30章 经典赛题讲解: books/ctf-special-training/第30章 经典赛题讲解.md
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- meta
- toc:
    permalink: ''
    slugify: !!python/name:pymdownx.slugs.uslugify
- pymdownx.arithmatex:
    generic: true
- pymdownx.caret
- pymdownx.details
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.magiclink
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.superfences
- pymdownx.tasklist
- pymdownx.tilde
- pymdownx.tabbed
plugins:
- search
- glightbox
extra_css:
- assets/stylesheets/extra.css
extra_javascript:
- assets/vendor/mathjax/tex-mml-chtml.js
- assets/vendor/mermaid/mermaid.min.js
