site_name: wjc-wiki
site_description: 自用复习知识库 · 求职 / 算法竞赛 / 论文精读
site_url: https://patrick-andstar.github.io/
docs_dir: docs
repo_url: https://github.com/patrick-andstar/patrick-andstar.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: white
    accent: red
    toggle:
      icon: material/weather-sunny
      name: 切到深色
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue
    accent: blue
    toggle:
      icon: material/weather-night
      name: 切到浅色
  features:
  - navigation.tabs
  - navigation.instant
  - navigation.top
  - navigation.indexes
  - content.code.copy
  - content.action.edit
  - search.highlight
  font:
    text: Fira Sans
    code: Fira Mono
  icon:
    logo: material/school

# 导航由 awesome-pages 依据目录结构 + 各目录下的 .pages 文件自动生成。
# 不要在这里写 nav，写了会自动导航失效（新增 md 也就不会自动出现）。

markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- md_in_html          # grid cards 与后续批注所需的 Markdown-in-HTML
- meta
- toc:
    permalink: ''
    slugify: !!python/name:pymdownx.slugs.uslugify
- pymdownx.arithmatex:
    generic: true
- pymdownx.caret
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.highlight:
    # 让 <code> 带上 language-xxx 类，运行代码的 JS 靠它识别语言。
    # 默认 false，此时 DOM 里完全看不出代码块是什么语言。
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.magiclink
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.superfences
- pymdownx.tasklist
- pymdownx.tilde
- pymdownx.tabbed

plugins:
- search:
    lang: [zh, en]
- glightbox
- awesome-pages

extra_css:
- assets/stylesheets/extra.css
- assets/stylesheets/run-code.css
extra_javascript:
- assets/vendor/mathjax/tex-mml-chtml.js
- assets/vendor/mermaid/mermaid.min.js
- assets/js/run-code.js
