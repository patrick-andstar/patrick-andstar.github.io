name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install mkdocs-material mkdocs-glightbox pymdown-extensions
      - name: 构建站点
        run: mkdocs build --strict
      - name: 上传构建产物（可下载 zip 预览）
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 两步发布：在仓库 Settings > Environments > github-pages 中
    # 把你自己设为 Required reviewer 并勾选「禁止绕过」，
    # 之后每次 push 都会停在这里等你批准后才真正发布。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
